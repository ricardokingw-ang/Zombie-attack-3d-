<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>喪屍狂潮 3D | Zombie Swarm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view" aria-label="遊戲畫面"></canvas>
  <div id="dmg"></div>
  <div id="cross"><span></span><span></span><span></span><span></span></div>

  <div class="hud" aria-live="polite">
    <div class="hpRow">
      <span>❤️</span>
      <div class="hpBar"><div class="hpFill" id="hpFill"></div></div>
      <span class="num" id="hpVal">100</span>
    </div>
    <div class="stats">
      <span><span id="wName">手槍</span> <b id="ammoVal">∞</b></span>
      <span>分數 <b id="scoreVal">0</b></span>
      <span>波數 <b id="waveVal">1</b></span>
      <span>敵人 <b id="leftVal">0</b></span>
    </div>
  </div>

  <div class="side">
    <canvas id="mini" width="120" height="120" aria-label="小地圖"></canvas>
    <div class="iconRow">
      <button class="iconBtn" id="adminBtn" aria-label="管理員模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></button>
      <button class="iconBtn" id="soundBtn" aria-label="切換音效"></button>
      <button class="iconBtn" id="pauseBtn" aria-label="暫停">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>
  </div>

  <div id="msg"></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="fireBtn" aria-label="開火">開火</button>
  <button id="swapBtn" aria-label="換槍"><b>🔫</b>手槍</button>
  <div class="wbar" id="wbar"></div>
  <div id="cheatTag">🛠️ 管理員外掛啟用中</div>

  <div id="overlay">
    <div class="card" id="card"></div>
  </div>

  <!-- 載入遊戲邏輯 -->
  <script src="js/game.js"></script>
</body>
</html>
